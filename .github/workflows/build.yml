name: build

# Public CI runs only the offline test suite. It uses no secrets, makes no
# external LLM or text-to-speech calls, and never receives the private
# system properties that the opt-in full-journal regression requires.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: JDK 21 test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Invoked through "bash ./mvnw" so the build does not depend on the
      # executable bit of the wrapper script being recorded in Git.
      - name: Build and test
        run: bash ./mvnw --batch-mode --no-transfer-progress clean test
